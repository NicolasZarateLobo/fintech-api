spring:
  application:
    name: tp-fintech-api-nzaratelobo

  datasource:
    url: JDBC:mysql://localhost:3306/fintech_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      dll-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true